name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: capacities-cli-aarch64-apple-darwin.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: capacities-cli-x86_64-apple-darwin.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: capacities-cli-x86_64-unknown-linux-gnu.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/capx staging/
          cp LICENSE README.md staging/
          cd staging
          tar czf ../${{ matrix.archive }} capx LICENSE README.md

      - name: Generate checksum
        run: shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create SHA256SUMS
        run: cat *.sha256 > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            capacities-cli-*.tar.gz
            SHA256SUMS.txt

  publish-crate:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3
      - name: Publish to crates.io
        run: doppler run -- cargo publish
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_CRATES }}

  update-homebrew:
    needs: release
    if: ${{ secrets.DOPPLER_TOKEN_GITHUB != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3
      - name: Fetch Homebrew token
        id: doppler
        run: |
          set -euo pipefail
          TOKEN=$(doppler secrets get HOMEBREW_TAP_TOKEN --plain 2>/dev/null)
          if [ -z "$TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN not found in Doppler"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "HOMEBREW_TAP_TOKEN=$TOKEN" >> "$GITHUB_OUTPUT"
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_GITHUB }}
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Read checksums
        id: checksums
        run: |
          cat *.sha256 > SHA256SUMS.txt
          echo "aarch64_apple=$(grep aarch64-apple-darwin SHA256SUMS.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "x86_64_apple=$(grep x86_64-apple-darwin SHA256SUMS.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "x86_64_linux=$(grep x86_64-unknown-linux-gnu SHA256SUMS.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Update Homebrew formula
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.doppler.outputs.HOMEBREW_TAP_TOKEN }}
          repository: JungHoonGhae/homebrew-capacities-cli
          event-type: update-formula
          client-payload: |
            {
              "version": "${{ steps.version.outputs.version }}",
              "aarch64_apple_sha256": "${{ steps.checksums.outputs.aarch64_apple }}",
              "x86_64_apple_sha256": "${{ steps.checksums.outputs.x86_64_apple }}",
              "x86_64_linux_sha256": "${{ steps.checksums.outputs.x86_64_linux }}"
            }
