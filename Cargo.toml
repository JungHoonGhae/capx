[package]
name = "capx"
version = "0.1.1"
edition = "2021"
description = "Unofficial CLI for Capacities.io"
license = "MIT"
repository = "https://github.com/JungHoonGhae/capx"
homepage = "https://github.com/JungHoonGhae/capx"
readme = "README.md"
keywords = ["capacities", "cli", "productivity", "note-taking"]
categories = ["command-line-utilities"]

[[bin]]
name = "capx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
colored = "3"
anyhow = "1"
chrono = "0.4"
regex = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
